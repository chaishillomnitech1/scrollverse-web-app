name: Sovereign System Invariant Audit

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sovereign-invariant-audit
  cancel-in-progress: false

jobs:
  validate-invariants:
    name: Validate deterministic project invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check application
        run: pnpm check

      - name: Run deterministic invariant tests
        run: pnpm test:sovereign
