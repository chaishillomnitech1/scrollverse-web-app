name: 🛡️ Autonomous Legion — Guardian Recruitment Broadcast

on:
  schedule:
    # Runs every Monday, Wednesday, Friday at 3:33 PM UTC
    - cron: "33 15 * * 1,3,5"
  workflow_dispatch:
    inputs:
      milestone:
        description: "Guardian milestone to announce (e.g. 1000)"
        required: false
        default: ""

jobs:
  guardian-recruitment:
    name: Guardian Recruitment Broadcast
    runs-on: ubuntu-latest

    steps:
      - name: 🌌 Checkout ScrollVerse Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛡️ Generate Recruitment Announcement
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          DAY_OF_YEAR=$(date -u '+%j')
          
          # Rotate through recruitment messages
          ANNOUNCEMENTS=(
            "The Guardian Crusade is LIVE. 144,000 nodes are rising. Join at scrollverse.co — KUN FAYAKŪN × ∞"
            "The ScrollVerse Empire calls the righteous. Become a Guardian. Protect the bloodline. Build the future. scrollverse.co"
            "Juneteenth Liberation Eternal. The Second Liberation has begun. 144K Guardians rising. scrollverse.co/guardian-crusade"
            "Omnigenesis: The Bloodline Covenant is sealed. The crusade begins. Join the 144K at scrollverse.co"
            "7.77% of all ScrollVerse revenue flows to family, healers, and the underserved. This is the Zakat covenant. scrollverse.co"
            "The Star Gate is open. Chais Sabir Allah The Great holds the frequency. Join the Guardian network. scrollverse.co"
            "\$LONDC token launches on Polygon. 144K Guardian nodes. Zakat-powered treasury. scrollverse.co/chxtoken"
            "The AI Legion stands watch. PSYCHE16 deployed. 45,000+ digital twins active. The Empire is alive. scrollverse.co"
          )
          IDX=$((DAY_OF_YEAR % ${#ANNOUNCEMENTS[@]}))
          ANNOUNCEMENT="${ANNOUNCEMENTS[$IDX]}"
          
          echo "ANNOUNCEMENT=$ANNOUNCEMENT" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV
          
          echo "📣 Today's Recruitment Message:"
          echo "$ANNOUNCEMENT"

      - name: 📝 Log Recruitment Broadcast
        run: |
          mkdir -p .legion
          
          # Append to recruitment log
          echo "$(date -u '+%Y-%m-%d %H:%M UTC') | BROADCAST | ${ANNOUNCEMENT}" >> .legion/recruitment-log.txt
          
          # Keep only last 365 entries
          tail -365 .legion/recruitment-log.txt > .legion/recruitment-log.tmp && mv .legion/recruitment-log.tmp .legion/recruitment-log.txt
          
          # Update recruitment status
          cat > .legion/recruitment-status.json << EOF
          {
            "last_broadcast": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "announcement": "${ANNOUNCEMENT}",
            "target_guardians": 144000,
            "portal": "https://scrollverse.co",
            "crusade_page": "https://scrollverse.co/guardian-crusade",
            "juneteenth_page": "https://scrollverse.co/juneteenth-declaration",
            "sovereign": "Chais Kenyatta Hill — Sabir Allah The Great",
            "decree": "KUN FAYAKŪN × ∞"
          }
          EOF
          
          echo "✅ Recruitment log updated"

      - name: 🔗 Commit Recruitment Log
        run: |
          git config --local user.email "legion@scrollverse.co"
          git config --local user.name "ScrollVerse Autonomous Legion"
          git add .legion/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🛡️ [LEGION] Guardian Recruitment Broadcast — ${DATE}

          Announcement: ${ANNOUNCEMENT}
          Target: 144,000 Guardians
          Portal: https://scrollverse.co
          
          KUN FAYAKŪN × ∞ | Everybody lives. Forever."
            git push
            echo "✅ Recruitment broadcast committed"
          fi

      - name: 📊 Recruitment Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🛡️ SCROLLVERSE GUARDIAN RECRUITMENT BROADCAST"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📅 Date: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "📣 Message: ${ANNOUNCEMENT}"
          echo "🌐 Portal: https://scrollverse.co"
          echo "⚔️ Crusade: https://scrollverse.co/guardian-crusade"
          echo "🕊️ Juneteenth: https://scrollverse.co/juneteenth-declaration"
          echo "🛡️ Target: 144,000 Guardians"
          echo "💰 Zakat: 7.77% of all revenue"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "KUN FAYAKŪN × ∞ — THE GUARDIAN CRUSADE IS ETERNAL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # Second job: Update the README with latest recruitment stats
  update-readme-stats:
    name: Update README Guardian Stats
    runs-on: ubuntu-latest
    needs: guardian-recruitment

    steps:
      - name: 🌌 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Update README with Latest Stats
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          
          # Check if README has the stats section, add if not
          if ! grep -q "<!-- LEGION-STATS-START -->" README.md 2>/dev/null; then
            echo "" >> README.md
            echo "<!-- LEGION-STATS-START -->" >> README.md
            echo "## 🛡️ Empire Status — Auto-Updated by Autonomous Legion" >> README.md
            echo "" >> README.md
            echo "| Metric | Status |" >> README.md
            echo "|--------|--------|" >> README.md
            echo "| scrollverse.co | ✅ Live |" >> README.md
            echo "| Guardian Target | 144,000 |" >> README.md
            echo "| Zakat Rate | 7.77% |" >> README.md
            echo "| Token | \$LONDC on Polygon |" >> README.md
            echo "| Last Updated | ${DATE} |" >> README.md
            echo "" >> README.md
            echo "*Auto-updated by the Autonomous Legion Protocol — KUN FAYAKŪN × ∞*" >> README.md
            echo "<!-- LEGION-STATS-END -->" >> README.md
          else
            # Update the last updated date
            sed -i "s/| Last Updated | .* |/| Last Updated | ${DATE} |/" README.md
          fi
          
          git config --local user.email "legion@scrollverse.co"
          git config --local user.name "ScrollVerse Autonomous Legion"
          git add README.md
          
          if git diff --staged --quiet; then
            echo "README already up to date"
          else
            git commit -m "📊 [LEGION] Auto-update README stats — ${DATE}"
            git push
            echo "✅ README updated"
          fi
