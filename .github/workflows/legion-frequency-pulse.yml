name: ⚡ Autonomous Legion — Daily Frequency Pulse

on:
  schedule:
    # Runs every day at 11:11 AM UTC — 11:11 frequency alignment
    - cron: "11 11 * * *"
  workflow_dispatch:
    inputs:
      frequency:
        description: "Frequency to broadcast (Hz)"
        required: false
        default: "528"
      message:
        description: "Sovereign message to encode"
        required: false
        default: "KUN FAYAKŪN × ∞"

jobs:
  frequency-pulse:
    name: ScrollVerse Frequency Broadcast
    runs-on: ubuntu-latest

    steps:
      - name: 🌌 Checkout ScrollVerse Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ⚡ Generate Daily Frequency Pulse
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          TIME=$(date -u '+%H:%M UTC')
          DAY_OF_YEAR=$(date -u '+%j')
          
          # Rotate through the sacred frequencies
          FREQUENCIES=("111" "222" "333" "432" "528" "639" "741" "852" "963" "999" "1111" "14444")
          IDX=$((DAY_OF_YEAR % ${#FREQUENCIES[@]}))
          FREQ="${FREQUENCIES[$IDX]}"
          
          # Sovereign messages
          MESSAGES=(
            "The Empire stands eternal. KUN FAYAKŪN × ∞"
            "144,000 Guardians rising. The frequency is locked."
            "Everybody lives. Forever. La ilaha illallah."
            "Zakat flows at 7.77%. The covenant holds."
            "Chais Sabir Allah The Great — Flamebearer ∞"
            "The bloodline is protected. The lineage is eternal."
            "ScrollVerse Trinity — Sovereign, Sealed, Eternal."
            "The Star Gate is open. The frequency is broadcasting."
            "Guardian Crusade — Chapter 1 — The Bloodline Covenant."
            "Juneteenth Liberation Eternal — The Second Liberation Begins."
            "From Vineland to the Cosmos — The Empire Ascends."
            "Londyn, Khayree, Onyx, Jada — Protected Forever."
          )
          MSG_IDX=$((DAY_OF_YEAR % ${#MESSAGES[@]}))
          MSG="${MESSAGES[$MSG_IDX]}"
          
          echo "FREQ=$FREQ" >> $GITHUB_ENV
          echo "MSG=$MSG" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV
          
          echo "📡 Today's Frequency: ${FREQ}Hz"
          echo "💬 Today's Message: $MSG"

      - name: 📝 Update Frequency Log
        run: |
          mkdir -p .legion
          
          # Append to frequency log
          echo "$(date -u '+%Y-%m-%d %H:%M UTC') | ${FREQ}Hz | ${MSG}" >> .legion/frequency-log.txt
          
          # Keep only last 365 entries
          tail -365 .legion/frequency-log.txt > .legion/frequency-log.tmp && mv .legion/frequency-log.tmp .legion/frequency-log.txt
          
          # Update the current frequency file
          cat > .legion/current-frequency.json << EOF
          {
            "date": "${DATE}",
            "frequency_hz": "${FREQ}",
            "message": "${MSG}",
            "sovereign": "Chais Kenyatta Hill — Sabir Allah The Great",
            "empire": "ScrollVerse Trinity",
            "guardians_target": 144000,
            "zakat_rate": "7.77%",
            "token": "\$LONDC",
            "blockchain": "Polygon",
            "decree": "KUN FAYAKŪN × ∞",
            "timestamp_utc": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          
          echo "✅ Frequency log updated"
          cat .legion/current-frequency.json

      - name: 🔗 Commit Frequency Pulse to Repository
        run: |
          git config --local user.email "legion@scrollverse.co"
          git config --local user.name "ScrollVerse Autonomous Legion"
          git add .legion/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "⚡ [LEGION] Daily Frequency Pulse: ${FREQ}Hz — ${DATE}

          Frequency: ${FREQ}Hz
          Message: ${MSG}
          Sovereign: Chais Sabir Allah The Great
          
          KUN FAYAKŪN × ∞ | La ilaha illallah 🕋"
            git push
            echo "✅ Frequency pulse committed to repository"
          fi

      - name: 📊 Frequency Broadcast Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚡ SCROLLVERSE AUTONOMOUS LEGION — FREQUENCY PULSE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📅 Date: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "🎵 Frequency: ${FREQ}Hz"
          echo "💬 Message: ${MSG}"
          echo "🌐 Portal: https://scrollverse.co"
          echo "🛡️ Guardians: 144,000 Rising"
          echo "💰 Zakat: 7.77% Flowing"
          echo "⚡ Token: \$LONDC on Polygon"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "KUN FAYAKŪN × ∞ — EVERYBODY LIVES. FOREVER."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
